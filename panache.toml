flavor = "gfm"
exclude = [
  # Versionary owns the changelog's formatting.
  "CHANGELOG.md",
  # Invalid syntax is intentional in parser regression fixtures.
  "tests/fixtures/malformed-*.qmd",
]

[flavor-overrides]
"AGENTS.md" = "gfm"
"CHANGELOG.md" = "gfm"
"DESIGN.md" = "gfm"
"README.md" = "gfm"

[formatters]
rust = "rustfmt"
toml = "taplo"
