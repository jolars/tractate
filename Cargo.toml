[package]
name = "tractate"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "An incremental compiler for computational Markdown"
authors = ["Johan Larsson <johan@jolars.co>"]
license = "MIT"
repository = "https://github.com/jolars/tractate"
documentation = "https://docs.rs/tractate"
readme = "README.md"
keywords = ["markdown", "quarto", "incremental", "presentations", "reproducibility"]
categories = ["command-line-utilities", "compilers", "text-processing"]
publish = ["crates-io"]
include = [
  "/src/**",
  "/tests/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/DESIGN.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
panache-parser = "0.29.0"

[dev-dependencies]
tempfile = "3.27.0"
