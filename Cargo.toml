[package]
name = "tractate"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "An incremental compiler for computational Markdown"
authors = ["Johan Larsson <johan@jolars.co>"]
license = "MIT"
repository = "https://github.com/jolars/tractate"
documentation = "https://docs.rs/tractate"
readme = "README.md"
keywords = ["markdown", "quarto", "incremental", "presentations", "reproducibility"]
categories = ["command-line-utilities", "compilers", "text-processing"]
publish = ["crates-io"]
include = [
  "/src/**",
  "/tests/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/DESIGN.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
panache-parser = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
